<ion-row>
  <ion-col size="4" size-sm="4" size-md="2">{{nr}}.
    <span  class="m73-link" (click)="nameClicked.emit()">{{exportList.i}}</span></ion-col>
  <ion-col size="8" size-sm="4" size-md="3">
    <ion-button *ngIf="exportList.a" fill="clear" (click)="mapClicked.emit()" aria-label="Pokaz na mapie">
      <ion-icon slot="icon-only"  name="map-outline" aria-hidden="true"></ion-icon>
    </ion-button>
    <ion-button *ngIf="!exportList.a" fill="clear" [disabled]="true" aria-label="Brak lokalizacji">
      <ion-icon slot="icon-only"   name="map-outline" aria-hidden="true"></ion-icon>
    </ion-button>    
    {{exportList.p}}
  </ion-col>
  <ion-col size="4" size-sm="4" size-md="1">{{exportList.b}}</ion-col>
  <ion-col size="8" size-sm="4" size-md="1" class="m73-type">
    @for (type of exportList.m; track type) {
      <mapy73pl-repeater-info-type [type]="type"></mapy73pl-repeater-info-type>
    }        
  </ion-col>

  <ion-col size="6" size-sm="4" size-md="2">{{exportList.r.toFixed(4)}}&nbsp;MHz</ion-col>
  <ion-col size="6" size-sm="4" size-md="2">{{exportList.t.toFixed(4)}}&nbsp;MHz</ion-col>

    <ion-buttons [collapse]="true">
      <ion-button (click)="removeClicked.emit()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>  
    </ion-buttons> 
  </ion-col> -->
</ion-row>
